<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LegalEase · Analysis Report</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    header {
      padding: 40px 20px 80px 20px;
      background: linear-gradient(135deg, #0d9488 0%, #4f46e5 100%);
      color: #fff;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
    header p { margin: 10px auto 0 auto; font-size: 1.1rem; opacity: 0.9; max-width: 600px; line-height: 1.5; font-weight: 500; }
    
    main { max-width: 800px; margin: -50px auto 40px auto; padding: 0 20px; }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      border: 1px solid #f1f5f9;
      padding: 40px;
    }
    .score-row { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; margin-bottom: 30px; text-align: center; }
    .score-circle {
      width: 100px; height: 100px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; font-weight: 800; color: #fff;
      background: #0ea5e9;
      box-shadow: 0 10px 20px rgba(14, 165, 233, 0.2);
    }
    .pill {
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    section { margin-top: 30px; }
    section h2 { font-size: 1.1rem; font-weight: 700; color: #334155; margin: 0 0 16px 0; display: flex; align-items: center; gap: 8px; }
    section h2 svg { width: 20px; height: 20px; color: #6366f1; }
    
    ul.clauses { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
    ul.clauses li {
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      font-size: 0.95rem;
      line-height: 1.5;
      background: #f8fafc;
      color: #475569;
    }
    .risk-high { border-left: 4px solid #e11d48; background: #fff1f2 !important; border-color: #ffe4e6 !important; }
    .risk-warn { border-left: 4px solid #f59e0b; background: #fffbeb !important; border-color: #fef3c7 !important; }
    
    .trap-box {
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      font-size: 0.95rem;
      color: #92400e;
      display: flex; flex-direction: column; gap: 4px;
    }
    .trap-box strong { font-size: 1rem; color: #b45309; }
    
    .summary-box {
      padding: 24px;
      border-radius: 16px;
      background: #f1f5f9;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #334155;
      border-left: 4px solid #3b82f6;
    }

    .btn-row {
      margin-top: 40px;
      display: flex; justify-content: center; gap: 16px;
    }
    a.btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    a.btn-primary {
      color: #fff;
      background: linear-gradient(135deg, #0d9488 0%, #4f46e5 100%);
      box-shadow: 0 8px 16px rgba(79, 70, 229, 0.2);
    }
    a.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 20px rgba(79, 70, 229, 0.3); }
    
    .empty { padding: 40px; text-align: center; color: #64748b; font-size: 1.1rem; }
    footer { padding: 0 24px 40px; text-align: center; font-size: 0.85rem; color: #94a3b8; max-width: 600px; margin: 0 auto; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <h1 id="hdrTitle">Analysis Report</h1>
    <p id="hdrSub">We scanned this page so you know exactly what you're agreeing to.</p>
  </header>
  <main>
    <div id="mount" class="card"></div>
  </main>
  <footer>
    This tool provides educational insights only—not legal advice. Consult a licensed attorney for decisions affecting your rights.
  </footer>
  <script src="results.js"></script>
</body>
</html>
