<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LegalEase AI - Popup</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-light: #64748b;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 400px;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    .container {
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 900;
      font-style: italic;
    }

    .title {
      font-size: 18px;
      font-weight: 800;
    }

    .title span {
      color: var(--primary);
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
      border: 1px solid #e2e8f0;
    }

    .section-title {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-light);
      margin-bottom: 12px;
    }

    .text-preview {
      font-size: 13px;
      line-height: 1.6;
      max-height: 100px;
      overflow-y: auto;
      color: var(--text);
      background: #f1f5f9;
      padding: 12px;
      border-radius: 12px;
      font-family: monospace;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      box-shadow: none;
    }

    #loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #e2e8f0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #results {
      display: none;
    }

    .score-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .score-high { background: #ecfdf5; color: #059669; }
    .score-med { background: #fffbeb; color: #d97706; }
    .score-low { background: #fef2f2; color: #dc2626; }

    .explanation {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      font-weight: 500;
    }

    .risk-tag {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 6px;
      margin-right: 8px;
    }

    .risk-high { background: #fee2e2; color: #ef4444; }
    .risk-warning { background: #fef3c7; color: #f59e0b; }
    .risk-safe { background: #dcfce7; color: #10b981; }

    .footer {
      text-align: center;
      font-size: 10px;
      color: var(--text-light);
      margin-top: 20px;
      font-weight: 600;
    }

    /* Voice AI Styles */
    .voice-ai-section {
      margin-top: 10px;
      border-top: 1px solid #e2e8f0;
      padding-top: 20px;
    }

    .mic-btn {
      width: 50px;
      height: 50px;
      border-radius: 25px;
      background: var(--bg);
      border: 2px solid var(--primary);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .mic-btn.active {
      background: var(--error);
      border-color: var(--error);
      color: white;
      animation: pulse-red 1.5s infinite;
    }

    @keyframes pulse-red {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    #chat-response {
      font-size: 13px;
      background: white;
      padding: 15px;
      border-radius: 15px;
      border: 1px solid #e2e8f0;
      margin-top: 10px;
      display: none;
      line-height: 1.5;
    }

    .status-text {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">L</div>
      <div class="title">LegalEase <span>AI</span></div>
    </div>

    <div id="selection-view">
      <div class="card">
        <div class="section-title">Selected Contract Text</div>
        <div id="selected-text" class="text-preview">Select text on a page and right-click to analyze, or paste it here...</div>
        <textarea id="manual-paste" style="display:none; width:100%; height:100px; margin-top:10px; border-radius:12px; border:1px solid #e2e8f0; padding:10px; font-size:12px; font-family:inherit;"></textarea>
      </div>
      <button id="analyze-btn">Analyze with AI →</button>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <div class="section-title">Applying Legal Intelligence...</div>
    </div>

    <div id="results" class="card">
      <div id="score-container">
        <!-- Score badge injected here -->
      </div>
      <div class="section-title">Plain English Summary</div>
      <p id="summary" class="explanation"></p>
      
      <div style="margin-top:20px; border-top:1px solid #f1f5f9; padding-top:15px;">
        <div class="section-title">Key Recommendation</div>
        <p id="recommendation" style="font-size:12px; color:var(--text-light); font-weight:600;"></p>
      </div>

      <button id="reset-btn" style="margin-top:20px; background:#f1f5f9; color:var(--text-light); box-shadow:none;">Analyze Another</button>
    </div>

    <div class="footer">
      Powered by LegalEase AI • Indian Contract Act 1872
    </div>

    <div class="voice-ai-section">
      <div class="section-title" style="text-align: center;">Legal Voice Assistant</div>
      <div id="mic-btn" class="mic-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      </div>
      <div id="voice-status" class="status-text">Tap to ask about a legal term</div>
      <div id="chat-response"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
